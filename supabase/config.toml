# ----------------------------------------------------------------------------
# Kundenseitiger Einstieg über Jobaufnahme-Links
# ----------------------------------------------------------------------------
# verify_jwt = false NUR für die Gast-Endpunkte. Jeder von ihnen prüft
# stattdessen selbst einen Token und läuft gegen ein Rate-Limit; keiner gibt
# ohne gültigen Token Daten heraus. Die Admin-Endpunkte stehen auf true UND
# prüfen zusätzlich has_role(admin) serverseitig — verify_jwt sagt nur, DASS
# ein Token gültig ist, nicht wem es gehört.
#
# intake-questions, parse-job-url und parse-job-pdf bleiben ausdrücklich auf
# verify_jwt = true. Der Gast erreicht sie ausschließlich über intake-ai, das
# Token prüft, Eingaben deckelt und die Aufrufe zählt.

